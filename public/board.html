<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SparrowMap · Beta board</title>
<style>
  :root{
    --bg:#0d1219; --panel:#141b25; --panel2:#1b2432; --line:#25303f;
    --ink:#e8eef6; --dim:#8a97a8; --accent:#3b82f6; --accent2:#2563eb;
    --ok:#22c55e; --warn:#f59e0b; --not:#ef4444; --violet:#a78bfa;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .hidden{display:none!important}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
         background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--violet);box-shadow:0 0 10px var(--violet)}
  .grow{flex:1}
  .stat{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
  a.back{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-decoration:none}
  a.back:hover{color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;padding:14px 14px 80px}
  .lede{color:var(--dim);font-size:13px;line-height:1.6;margin:0 0 14px}
  .lede b{color:var(--ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
                        padding:7px 9px;font:inherit;font-size:13px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{width:100%;min-height:70px;resize:vertical}
  button.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;
             padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  button.btn:hover{border-color:var(--accent)}
  button.btn.primary{background:var(--accent2);border-color:var(--accent2)}
  button.btn:disabled{opacity:.5;cursor:default}
  .split{display:grid;grid-template-columns:minmax(300px,5fr) minmax(340px,7fr);gap:14px}
  @media (max-width:900px){.split{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h3{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim);
           text-transform:uppercase;letter-spacing:.08em}
  .pad{padding:12px}
  .item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:var(--panel2)} .item.on{background:#172236}
  .item .t{font-weight:600}
  .item .m{color:var(--dim);font-size:12px;margin-top:3px;font-family:var(--mono)}
  .tag{display:inline-block;font:11px var(--mono);padding:2px 6px;border-radius:6px;background:var(--panel2);
       border:1px solid var(--line);color:var(--dim);margin-right:4px;white-space:nowrap}
  .s-proposed{color:var(--dim)} .s-approved{color:var(--ok);border-color:#1b4a2a} .s-building{color:var(--accent)}
  .s-beta{color:var(--violet)} .s-done{color:var(--ok)} .s-declined{color:var(--not)}
  .k-bug{color:var(--warn)}
  .note{padding:10px 12px;border-bottom:1px solid var(--line)}
  .note .who{font:11.5px var(--mono);color:var(--dim);margin-bottom:3px}
  .note .b{white-space:pre-wrap;font-size:13.5px;line-height:1.5}
  .note.sys .b{color:var(--dim);font-family:var(--mono);font-size:12px}
  .body{white-space:pre-wrap;font-size:13.5px;line-height:1.55;padding:12px;border-bottom:1px solid var(--line)}
  .center{padding:40px 20px;text-align:center;color:var(--dim)}
  .toasts{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
  .toast{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px}
  .toast.bad{border-color:var(--not);color:#fca5a5}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  label.f input,label.f select{width:100%}
</style>
</head>
<body>
<header>
  <span class="brand"><span class="dot"></span> Beta board</span>
  <span class="stat" id="stat"></span>
  <span class="grow"></span>
  <span class="stat" id="who"></span>
  <a class="back" href="/">&larr; map</a>
</header>

<div class="wrap">
  <p class="lede">
    What contributors want, what was decided, and the notes under each. <b>A request is a proposal
    until it is marked approved</b>; the bot only builds approved items. Talk on Sparrow Send, record it here.
  </p>
  <div class="split">
    <div>
      <div class="card">
        <h3>New request</h3>
        <div class="pad">
          <label class="f">Title<input id="n-title" placeholder="one line"></label>
          <label class="f">Kind<select id="n-kind"><option value="request">request</option><option value="bug">bug</option><option value="note">note</option></select></label>
          <label class="f">Detail<textarea id="n-body" placeholder="what, why, and how you would know it works"></textarea></label>
          <button class="btn primary" id="n-go">Add</button>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <select id="f-status"><option value="">All statuses</option></select>
        <select id="f-kind"><option value="">All kinds</option><option value="request">request</option><option value="bug">bug</option><option value="note">note</option></select>
      </div>
      <div class="card"><h3>Requests</h3><div id="list"></div></div>
    </div>
    <div id="detail" class="card"><h3>Pick a request</h3><div class="center">Select one on the left.</div></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var WKEY = "sparrow_rv_wallet";
  var STATUSES = ["proposed","approved","building","beta","done","declined"];
  var token = null, me = null, trusted = false, current = null;

  function loadWallet(){ try { return JSON.parse(localStorage.getItem(WKEY) || "[]"); } catch(e){ return []; } }
  function api(path, opts){
    opts = opts || {}; opts.headers = Object.assign({}, opts.headers);
    if(token) opts.headers["Authorization"] = "Bearer " + token;
    if(opts.body && typeof opts.body !== "string"){ opts.body = JSON.stringify(opts.body); opts.headers["Content-Type"] = "application/json"; opts.method = opts.method || "POST"; }
    return fetch(path, opts).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok){ var e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; throw e; } return j; }); });
  }
  function toast(msg, bad){ var t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
    $("#toasts").appendChild(t); setTimeout(function(){ t.style.opacity = "0"; t.style.transition = "opacity .3s"; }, bad ? 4200 : 2200); setTimeout(function(){ t.remove(); }, bad ? 4600 : 2600); }
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined && text !== null) e.textContent = text; return e; }
  function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
  function when(ts){ if(!ts) return ""; return new Date(ts*1000).toISOString().slice(0,16).replace("T"," "); }

  function start(){
    var w = loadWallet();
    // The beta cookie signs the page in already; a wallet token is a bonus.
    token = w.length ? w[0].token : null;
    api("/api/board/me").then(function(m){
      me = m; trusted = !!m.trusted;
      $("#who").textContent = (m.label || "?") + (trusted ? " · decides" : "");
      var fs = $("#f-status"); STATUSES.forEach(function(s){ var o = el("option", "", s); o.value = s; fs.appendChild(o); });
      load();
    }).catch(function(e){
      clear($("#list")); $("#list").appendChild(el("div", "center", "Not signed in: " + e.message + ". Open the beta sign-in first."));
    });
  }
  function load(){
    api("/api/board/list?status=" + encodeURIComponent($("#f-status").value) + "&kind=" + encodeURIComponent($("#f-kind").value)).then(function(r){
      var L = $("#list"); clear(L);
      var c = r.counts || {}; $("#stat").textContent = STATUSES.map(function(s){ return c[s] ? (c[s] + " " + s) : null; }).filter(Boolean).join(" · ");
      if(!r.rows.length){ L.appendChild(el("div", "center", "Nothing yet. Add the first request.")); return; }
      r.rows.forEach(function(it){
        var d = el("div", "item" + (current === it.id ? " on" : ""));
        var t = el("div", "t"); t.appendChild(el("span", "tag s-" + it.status, it.status)); if(it.kind !== "request") t.appendChild(el("span", "tag k-" + it.kind, it.kind)); t.appendChild(document.createTextNode("#" + it.id + " " + it.title)); d.appendChild(t);
        d.appendChild(el("div", "m", it.by + " · " + when(it.ts) + " · " + it.notes + " note" + (it.notes === 1 ? "" : "s") + (it.last_note ? " · last " + when(it.last_note) : "")));
        d.addEventListener("click", function(){ current = it.id; document.querySelectorAll(".item.on").forEach(function(x){ x.classList.remove("on"); }); d.classList.add("on"); open(it.id); });
        L.appendChild(d);
      });
    }).catch(function(e){ toast(e.message, true); });
  }
  $("#f-status").addEventListener("change", load); $("#f-kind").addEventListener("change", load);
  $("#n-go").addEventListener("click", function(){
    var title = $("#n-title").value.trim(); if(!title){ toast("title required", true); return; }
    api("/api/board/add", {body:{title:title, body:$("#n-body").value, kind:$("#n-kind").value}}).then(function(r){
      if(!r.ok) throw new Error(r.error); $("#n-title").value = ""; $("#n-body").value = ""; toast("added #" + r.id); current = r.id; load(); open(r.id);
    }).catch(function(e){ toast(e.message, true); });
  });
  $("#n-title").addEventListener("keydown", function(ev){ if(ev.key === "Enter") $("#n-go").click(); });

  function open(id){
    var D = $("#detail"); clear(D); D.appendChild(el("h3", "", "Loading…"));
    api("/api/board/item?id=" + id).then(render).catch(function(e){ clear(D); D.appendChild(el("h3", "", "Error")); D.appendChild(el("div", "pad", e.message)); });
  }
  function render(it){
    var D = $("#detail"); clear(D);
    var h = el("h3", ""); h.appendChild(el("span", "tag s-" + it.status, it.status)); if(it.kind !== "request") h.appendChild(el("span", "tag k-" + it.kind, it.kind)); h.appendChild(document.createTextNode("#" + it.id + " " + it.title)); D.appendChild(h);
    D.appendChild(el("div", "body", (it.body || "(no detail)") + "\n\n— " + it.by + ", " + when(it.ts) + (it.decided_by ? " · status by " + it.decided_by : "")));
    if(trusted){
      var r = el("div", "pad"); var row = el("div", "row");
      row.appendChild(el("span", "stat", "set status:"));
      STATUSES.forEach(function(s){ if(s === it.status) return; var b = el("button", "btn", s);
        b.addEventListener("click", function(){ var why = window.prompt("Why? (recorded in the thread)", ""); if(why === null) return;
          api("/api/board/status", {body:{id:it.id, status:s, why:why}}).then(function(x){ if(!x.ok) throw new Error(x.error); toast("now " + s); load(); open(it.id); }).catch(function(e){ toast(e.message, true); }); });
        row.appendChild(b); });
      r.appendChild(row); D.appendChild(r);
    }
    var N = el("div");
    it.notes.forEach(function(n){ var d = el("div", "note" + (n.body.indexOf("[") === 0 ? " sys" : "")); d.appendChild(el("div", "who", n.by + " · " + when(n.ts))); d.appendChild(el("div", "b", n.body)); N.appendChild(d); });
    if(!it.notes.length) N.appendChild(el("div", "center", "No notes yet."));
    D.appendChild(N);
    var p = el("div", "pad"); var ta = el("textarea"); ta.placeholder = "add a note"; p.appendChild(ta);
    var b = el("button", "btn primary", "Add note"); b.style.marginTop = "8px";
    b.addEventListener("click", function(){ var body = ta.value.trim(); if(!body){ toast("empty", true); return; }
      api("/api/board/note", {body:{id:it.id, body:body}}).then(function(x){ if(!x.ok) throw new Error(x.error); toast("noted"); load(); open(it.id); }).catch(function(e){ toast(e.message, true); }); });
    p.appendChild(b); D.appendChild(p);
  }
  start();
})();
</script>
</body>
</html>
