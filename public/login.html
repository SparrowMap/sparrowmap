<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RavenMap — operator sign in</title>
<style>
:root{--bg:#0B0E13;--panel:#11151d;--line:#2a3244;--ink:#e8edf5;--dim:#9aa7b8;
 --blue:#1B74D1;--bad:#ff3b47;--ok:#39d98a;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--mono);
 display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{width:min(92vw,420px);background:var(--panel);border:1px solid var(--line);
 border-radius:12px;padding:26px 24px}
h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
h1 span{color:var(--blue)}
p{color:var(--dim);font-size:12.5px;margin:0 0 18px}
input{width:100%;background:#080b11;border:1px solid var(--line);border-radius:8px;
 color:var(--ink);font:13px var(--mono);padding:11px 12px;margin-bottom:12px}
button{width:100%;background:var(--blue);color:#061018;border:0;border-radius:8px;
 font:600 13px var(--mono);letter-spacing:.04em;text-transform:uppercase;
 padding:12px;cursor:pointer}
.msg{font-size:12.5px;margin-top:14px;min-height:18px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.hint{color:#63718a;font-size:11.5px;margin-top:16px;line-height:1.5}
code{background:#080b11;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style></head><body>
<div class="card">
  <h1><span>&#9679;</span> SparrowMap operator</h1>
  <p>Paste the operator token to sign in. It is on this machine at
     <code>data/operator.token</code> and is never sent anywhere but this hub.</p>
  <input id="tok" type="password" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="operator token" aria-label="operator token">
  <button id="go">Sign in</button>
  <div class="msg" id="msg"></div>
  <div class="hint">The session is a single <code>HttpOnly; SameSite=Strict</code>
     cookie that lasts 14 days. Signing out anywhere clears it.</div>
</div>
<script src="/static/login.js"></script>
</body></html>
